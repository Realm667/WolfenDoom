name: Add-on metadata

on:
  push:
    paths:
      - '_addons/**'
      - '.github/workflows/addon-metadata.yml'
  pull_request:
    paths:
      - '_addons/**'
      - '.github/workflows/addon-metadata.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./_addons/validate_metadata.ps1
