name: Update font character table
on:
  push:
    paths:
    - 'language.csv'
    - '.github/workflows/fontchars.yml'
    - 'tools/programs/fontchecker/**'
    - 'fonts/**/*'
    - '!fonts/fontchars.csv'
    branches: [ master ]
  workflow_dispatch:

jobs:
  scan_fonts:
    name: Scan fonts
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository_owner == 'Realm667' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal
      - name: Scan language table, fonts, and update font character table
        run: |
          cargo +stable run --locked --manifest-path tools/programs/fontchecker/Cargo.toml -- "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/fontchars.csv"
          test -s "$RUNNER_TEMP/fontchars.csv"
          mv "$RUNNER_TEMP/fontchars.csv" fonts/fontchars.csv
      - name: Commit updated font character table
        if: ${{ !env.ACT }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add fonts/fontchars.csv
          if git diff --cached --quiet -- fonts/fontchars.csv; then exit 0; fi
          git commit -m "Update fontchars.csv"
          git push
