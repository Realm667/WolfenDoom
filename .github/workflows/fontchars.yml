name: Update font character table
on:
  push:
    paths:
    - 'language.csv'
    - 'fonts/**/*'
    - '!fonts/fontchars.csv'
    branches: [ master ]
  workflow_dispatch:

jobs:
  scan_fonts:
    name: Scan fonts
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository_owner == 'Realm667' }}
    runs-on: ubuntu-latest
    env:
      REPO_ROOT: ${{github.workspace}}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Rust tools
        uses: actions-rs/toolchain@v1
      - name: Scan language table, fonts, and update font character table
        run: |
          cd $REPO_ROOT/tools/programs/fontchecker 
          cargo run -- $REPO_ROOT > $REPO_ROOT/fonts/fontchars.csv
      - name: Commit updated font character table
        if: ${{ !env.ACT }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add fonts/fontchars.csv
          # Force 0 exit status here so that the workflow run doesn't fail
          git commit -m "Update fontchars.csv" && git push || :
